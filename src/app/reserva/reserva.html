<main class="contenedor">
  <h1>Reserva de habitación</h1>

  <form [formGroup]="form" (ngSubmit)="enviar()" novalidate>
    <label for="nombre">Nombre completo</label>
    <input id="nombre" type="text" formControlName="nombre" />

    <label for="correo">Correo electrónico</label>
    <input id="correo" type="email" formControlName="correo" />

    <label for="noches">Número de noches</label>
    <input id="noches" type="number" formControlName="noches" />

    <button type="submit">Reservar</button>
  </form>

  @if (enviado()) {
    <p class="exito">¡Reserva registrada correctamente!</p>
  }
</main>
